<html>

    <head>
        <meta charset="UTF-8" />
        <script src="lib/jquery-3.6.0.min.js"></script>
        <script src="js/api.js"></script>
        <script src="js/base64.min.js"></script>
        <script src="js/register.js"></script>
        <script src="lib/crypto-js.min.js"></script>
        <script type="module" src="lib/site.min.js" async defer></script>
        <script nomodule src="lib/site.compat.min.js" async defer></script>
        <link rel="stylesheet" href="css/login.css" />
        <title>登陆页面</title>
    </head>

    <body>
        <div class="bg-image"></div>
        <div>
            <div class="margin"></div>
            <div class="form"><br>
                <h2>登录</h2><br>
                <p>用户名</p>
                <input type="text" id="username" placeholder="请输入用户名"><br>
                <p>密码</p>
                <input type="text" id="password" placeholder="请输入密码">
                <p>重复密码</p>
                <input type="text" id="password2" placeholder="请再次输入密码">
                <br>
                <div class="frc-captcha" data-sitekey="FCMJOIQHSPPBEI93" data-api-endpoint="global"></div><br>
                <button class="button" type="button"
                    onclick="javascript:register($('#username').value,$('#password').value)">注册</button>
            </div>
        </div>
    </body>

</html>
