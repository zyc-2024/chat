<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<title>正在退出登录……</title>
	</head>
	<body>
		<script>
			try {
				localStorage.removeItem("chat_auth_v1");
			} catch (e) {}
			document.cookie = "n=;path=/;expires=Thu, 01 Jan 1970 00:00:00 GMT";
			document.cookie =
				"auth=;path=/;expires=Thu, 01 Jan 1970 00:00:00 GMT";
			window.location.replace(
				window.location.pathname.replace(/[^/]*$/, "") + "#/",
			);
		</script>
	</body>
</html>
