<div style="display: none;">
    <iframe id="msg"></iframe>
    <h1 id="titlee"></h1>
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>
</div>
<div class="chat" style="width: 950.17px;">
    <div id="chat" style="width: 950.17px;">
        <h1 id="nomsg">聊天记录加载中……<br>如果加载时间过长，则可能是页面不存在</h1>
    </div>
</div>


<script>
    //Script loading bar generated by AI. 

    // 需要加载的脚本资源
    function getarg() {
        let a = window.location.search.substring(1).split("&");
        let c = {};
        a.forEach(function (e) {
            let b = e.split("=");
            c[b[0]] = b[1];
        });
        return c;
    }
    let typee = getarg().type;
    let scripts = [
        "lib/jquery-3.6.0.min.js",
        "lib/crypto-js.min.js",
        "js/base64.min.js",
        "lib/spark-md5.min.js",
        "js/api.js",
        "lib/markdown-it.min.js",
        "lib/markdown-it-task-lists.min.js",
        "lib/markdown-it-multimd-table.min.js",
        "katex/katex.min.js",
        "lib/purify.min.js",
        "hljs/highlight.min.js",
        // "hljs/highlightjs-line-numbers.min.js",
        // "hljs/highlight.min.js"
        "js/render.js",
        "js/f.js"
    ];
    let loaded = 0;
    const progressBar =
        document.getElementById("progress-bar");
    function updateProgress() {
        const percent = Math.round(
            (loaded / scripts.length) * 100
        );
        progressBar.style.width = percent + "%";
        if (loaded === scripts.length) {
            setTimeout(() => {
                document.getElementById(
                    "progress-container"
                ).style.display = "none";
            }, 300);
        }
    }
    function loadScript(src) {
        return new Promise((resolve, reject) => {
            const s = document.createElement("script");
            s.src = src;
            s.onload = () => {
                loaded++;
                updateProgress();
                resolve();
            };
            s.onerror = reject;
            document.body.appendChild(s);
            document.body.style.display = "flex";
        });
    }
    (async () => {
        for (const src of scripts) {
            // 收集 promise，最后一次迭代时等待全部完成并触发事件
            window.__scriptLoadPromises =
                window.__scriptLoadPromises || [];
            window.__scriptLoadPromises.push(
                loadScript(src)
            );
            if (
                window.__scriptLoadPromises.length ===
                scripts.length
            ) {
                await Promise.all(
                    window.__scriptLoadPromises
                );
                // 所有脚本加载完毕，触发事件（或者在这里直接执行第104行的代码）
                document.dispatchEvent(
                    new Event("allScriptsLoaded")
                );
            }
        }
    })();
</script>
