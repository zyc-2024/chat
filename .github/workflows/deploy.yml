name: Build, deploy and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run data-layer tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload web build for local app
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  package:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build local Windows app
        run: >
          pyinstaller --noconfirm --clean --onefile --name zyc-chat
          --distpath build/app-dist --workpath build/app-work
          --add-data "web-dist;dist" app.py

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          git fetch --tags --force
          CURRENT_TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$CURRENT_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          LAST_TAG=$(git tag --sort=-creatordate | grep -E '^v3\.0\.0-beta\.[0-9]+$' | grep -vx "$CURRENT_TAG" | head -n 1 || true)
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "Last release tag: ${LAST_TAG:-none}"

      - name: Generate release notes
        shell: bash
        run: node scripts/release-notes.mjs "${{ steps.release.outputs.last_tag }}"

      - name: Assemble release files
        shell: powershell
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "build/app-dist/zyc-chat.exe" "release/zyc-chat-$env:VERSION.exe"
          Copy-Item "CHANGELOG.md" "release/CHANGELOG.md"
          Copy-Item "release-notes.md" "release/CHANGELOG-SINCE-LAST-RELEASE.md"
          $readme = @"
          zyc2024 Chat - 本地运行版 $env:VERSION

          1. 双击 zyc-chat-$env:VERSION.exe
          2. 程序会在 127.0.0.1 启动本地服务并自动打开浏览器
          3. 关闭控制台窗口即可退出
          4. 需要联网访问 Gitee 上的聊天数据

          CHANGELOG.md：完整更新日志
          CHANGELOG-SINCE-LAST-RELEASE.md：距上次发布的所有修改记录
          "@
          $readme | Set-Content "release/README.txt" -Encoding UTF8
          $files = @(
            "release/zyc-chat-$env:VERSION.exe",
            "release/CHANGELOG.md",
            "release/CHANGELOG-SINCE-LAST-RELEASE.md",
            "release/README.txt"
          )
          Compress-Archive -Path $files -DestinationPath "release/zyc-chat-$env:VERSION-local-win64.zip" -Force

      - name: Upload local app artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-app
          path: release
          retention-days: 14

      - name: Publish GitHub Release
        if: steps.release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.version }}
          body_path: release/CHANGELOG-SINCE-LAST-RELEASE.md
          files: |
            release/zyc-chat-*.exe
            release/zyc-chat-*-local-win64.zip
            release/CHANGELOG.md
            release/CHANGELOG-SINCE-LAST-RELEASE.md
            release/README.txt
          fail_on_unmatched_files: true
          make_latest: true

      - name: Add release notes to workflow summary
        shell: bash
        run: cat release/CHANGELOG-SINCE-LAST-RELEASE.md >> "$GITHUB_STEP_SUMMARY"
